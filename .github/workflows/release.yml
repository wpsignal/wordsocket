name: WordSocket Plugin Release

# The whole release runs here, in order, so nothing reaches WordPress.org that
# was not built and verified first:
#
#   1. build    typecheck, webpack, POT, zip (bin/dist.sh); the zip's version
#               must match the tag.
#   2. github   create the GitHub release with wordsocket.zip attached.
#   3. wporg    publish the same zip to WordPress.org SVN (bin/svn.sh) using
#               the WPORG_SVN_USERNAME / WPORG_SVN_PASSWORD secrets.
#
# Triggers:
#   Tag push  : npm run release -- [--tested <wp>] <version>   (bin/release.sh
#               bumps, commits, tags vX.Y.Z and pushes). Publishes for real.
#   Manual    : Actions > WordSocket Plugin Release > Run workflow.
#               Builds the zip and creates a draft release; never touches SVN.
#
# A failed run publishes nothing. Fix the cause, then move the tag onto the fix:
#   git tag -fs vX.Y.Z -m "Release vX.Y.Z" && git push --force origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install WP-CLI
        run: |
          curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install dependencies
        run: npm ci

      - name: Build release zip
        run: bash bin/dist.sh

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify the zip matches the tag
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          header=$(unzip -p dist/wordsocket.zip wordsocket/wordsocket.php | grep -m1 'Version:' | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          stable=$(unzip -p dist/wordsocket.zip wordsocket/readme.txt | grep -m1 '^Stable tag:' | sed 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')
          echo "package.json=$version header=$header stable=$stable ref=${{ github.ref_name }}"
          [[ "$header" == "$version" && "$stable" == "$version" ]] || { echo "::error::zip version does not match package.json"; exit 1; }
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            [[ "${{ github.ref_name }}" == "v$version" ]] || { echo "::error::tag ${{ github.ref_name }} does not match version $version"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${{ needs.build.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: WordSocket v${{ needs.build.outputs.version }}
          draft: ${{ steps.tag.outputs.draft }}
          files: dist/wordsocket.zip
          body: |
            Install via **Plugins > Add New > Upload Plugin** in your WordPress admin.

            Download `wordsocket.zip` below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wporg:
    # Real tags only, and only when the SVN credentials are configured.
    needs: [build, github]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        env:
          USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: |
          if [[ -z "$USERNAME" || -z "$PASSWORD" ]]; then
            echo "::warning::WPORG_SVN_USERNAME / WPORG_SVN_PASSWORD not set; skipping the WordPress.org publish"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: dist
          path: dist

      - name: Install Subversion
        if: steps.creds.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Sparse checkout of the WordPress.org repository
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -euo pipefail
          svn checkout --quiet --depth immediates https://plugins.svn.wordpress.org/wordsocket ../wordsocket-svn
          cd ../wordsocket-svn
          svn update --quiet --set-depth infinity trunk assets

      - name: Publish to WordPress.org
        if: steps.creds.outputs.ok == 'true'
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SVN_DIR: ${{ github.workspace }}/../wordsocket-svn
        run: bash bin/svn.sh
